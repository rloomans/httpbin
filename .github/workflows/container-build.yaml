name: "Container Build"

on:
  workflow_dispatch:
  push:
    branches:
      - "main"

jobs:
  requirements:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Poetry
        run: pipx install poetry

      - name: Install Poetry Export Plugin
        run: poetry self add poetry-plugin-export

      - name: Export requirements.txt
        run: poetry export --format requirements.txt --output requirements.txt --no-interaction

      - name: Upload requirements.txt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: requirements
          path: requirements.txt
          if-no-files-found: error

  build:
    needs: requirements
    strategy:
      matrix:
        containers:
          - tag: latest
            file: Dockerfile
          - tag: alpine
            file: Dockerfile.alpine
          - tag: nginx
            file: Dockerfile.nginx
          - tag: unit
            file: Dockerfile.unit
          - tag: httpd
            file: Dockerfile.httpd
          - tag: httpd-alpine
            file: Dockerfile.httpd-alpine
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download requirements.txt
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: requirements

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build container image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.containers.file }}
          platforms: linux/amd64
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: httpbin:${{ matrix.containers.tag }}

